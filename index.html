<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneClickSpain.com — Coming Soon</title>
<meta name="description" content="A live digital window into every region of Spain, for the global Spanish diaspora — coming soon.">
<style>
  :root{ --green:#AA151B; --gold:#F1BF00; --ink:#1a1a1a; --paper:#F6F3EC; }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center;
    min-height:100vh; text-align:center; padding:24px;
  }
  .wrap{ max-width:560px; }
  h1{ font-size:clamp(28px,5vw,44px); margin:0 0 14px; }
  h1 span{ color:var(--green); }
  p{ font-size:18px; color:#555; line-height:1.6; margin-bottom:28px; }
  .badge{
    display:inline-block; font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--gold); background:var(--ink); padding:8px 16px; border-radius:999px; margin-bottom:24px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Coming Soon</div>
    <h1>OneClick<span>Spain</span>.com</h1>
    <p>A live digital window into every region of Spain — news, culture and community, for the global Spanish diaspora. Site launching soon.</p>
  </div>
</body>
</html>
